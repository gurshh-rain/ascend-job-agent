[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-bot"
version = "1.0.0"
description = "Agentic 2027 summer internship finder with email approve/reject workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "jinja2",
    "pandas",
    "questionary",
    "rich",
]

[project.scripts]
internship-bot = "run_daily:cli"
internship-bot-manage = "manage:main"

[project.urls]
Homepage = "https://github.com/gurshaan1124/internship-bot"
Repository = "https://github.com/gurshaan1124/internship-bot"

[tool.setuptools]
py-modules = ["run_daily", "manage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config", "scraper", "llm", "mailer", "server", "sheet"]

[tool.setuptools.package-data]
config = [".env.example"]
mailer = ["templates/*.html"]
